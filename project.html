<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Project details from Asawari Sakharkar's portfolio." />
    <title>Project | Asawari Sakharkar</title>
    <link rel="icon" type="image/jpeg" href="assets/favicononinini.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiko:wght@400;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/js/content.js" defer></script>
    <script src="assets/js/project.js" defer></script>
  </head>
  <body class="project-page">
    <header class="site-header">
      <div class="container header__inner">
        <a class="btn-resume project-page__back" href="index.html">
          <span class="project-page__back-arrow" aria-hidden="true">←</span>
          <span>Back to main page</span>
        </a>
        <a class="project-page__brand" href="index.html">Asawari Sakharkar</a>
      </div>
    </header>
    <main class="project-detail" id="project-detail">
      <div class="container">
        <div class="project-detail__layout" id="project-content" hidden>
          <section class="project-detail__copy" aria-labelledby="project-title">
            <p class="project-detail__category" id="project-category"></p>
            <h1 class="project-detail__title" id="project-title"></h1>
            <p class="project-detail__description" id="project-description"></p>
            <ul class="project-tags project-detail__tags" id="project-tags" aria-label="Project tags"></ul>
            <a
              class="project-detail__link"
              id="project-external-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              hidden
            >
              View full case study
            </a>
          </section>
          <figure class="project-detail__visual">
            <img class="project-detail__image" id="project-image" src="" alt="" />
          </figure>
        </div>
        <section class="project-document" id="project-document" aria-label="Case study PDF" hidden>
          <iframe class="project-document__frame" id="project-pdf-frame" title="Case study PDF"></iframe>
        </section>
        <p class="project-detail__not-found" id="project-not-found" hidden>
          This project could not be found. <a href="index.html#projects">Return to projects</a>.
        </p>
      </div>
    </main>
  </body>
</html>

name: Deploy to GitHub Pages

# Publishes the static site whenever you push to the main branch.
on:
  push:
    branches: ["main"]
  workflow_dispatch: {} # lets you trigger a deploy manually from the Actions tab

# Permissions required by the Pages deploy action
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (and set the source to GitHub Actions) if it
          # isn't configured yet, avoiding the "Get Pages site failed" error.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Ensure reruns don't collide with artifacts from previous attempts.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          # This is a plain static site, so we publish the repo root as-is.
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
